<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>“e”农通 - 让农耕更科学</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/guide.css">
  <link rel="stylesheet" href="css/enhance.css">
  <link rel="stylesheet" href="css/course-player-admin.css">
</head>
<body>

  <!-- 全屏背景遮罩层 -->
  <div class="guide-bg"></div>

  <!-- 页面主体容器 -->
  <div class="guide-wrapper">
    <!-- 顶部导航区 (Logo展示) -->
    <header class="guide-header">
      <div class="brand-logo">
        <img src="images/logo.png" alt="e农通">
        <span>“e”农通</span>
      </div>
    </header>

    <!-- 核心内容区 -->
    <main class="guide-main">
      <div class="content-box">
        <div class="badge">数字化助农服务平台</div>
        
        <h1 class="title">
          e分耕耘 e分收获<br>
          <span class="highlight">让农耕更科学</span>
        </h1>
        
        <p class="desc">
          汇聚前沿农业资讯，精选优质农机装备。<br>
          连接海量农业专家，用科技赋能每一寸土地的丰收。
        </p>
        
        <div class="action-group">
          <a href="onboarding.html" class="btn-primary-large">
            先去逛逛
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>

        <div class="features-list">
          <div class="feature-item">
            <i class="fa-solid fa-tractor"></i>
            <span>智能农机商城</span>
          </div>
          <div class="feature-item">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>海量农技培训</span>
          </div>
          <div class="feature-item">
            <i class="fa-solid fa-seedling"></i>
            <span>政策气象资讯</span>
          </div>
        </div>
      </div>
      
      <!-- 右侧插画/浮动卡片区 -->
      <div class="illustration-box">
        <div class="floating-card card-1">
          <div class="card-icon" style="color: #4fc3f7;"><i class="fa-solid fa-cloud-sun"></i></div>
          <div class="card-info">
            <h4>智能气象分析</h4>
            <p>基于AI预测，未来24小时适宜播种</p>
          </div>
        </div>
        
        <div class="floating-card card-2">
          <div class="card-icon" style="color: #81c784;"><i class="fa-solid fa-satellite-dish"></i></div>
          <div class="card-info">
            <h4>农机北斗监控</h4>
            <p>全国在线作业设备: 12,084 台</p>
          </div>
        </div>
        
        <div class="floating-card card-3">
          <div class="card-icon" style="color: #ffb74d;"><i class="fa-solid fa-chart-line"></i></div>
          <div class="card-info">
            <h4>市场行情预测</h4>
            <p>冬小麦主产区收购价呈上涨趋势</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
