<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>“e”农通 - 气象预警</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/home.css"><link rel="stylesheet" href="css/enhance.css">
  <link rel="stylesheet" href="css/course-player-admin.css"><link rel="stylesheet" href="css/service.css"></head><body><nav class="navbar"><div class="nav-brand"><img src="images/logo.png" alt="e农通Logo" style="height:40px;"> “e”农通</div><div class="nav-links"><a href="home.html" class="nav-item active">首页</a><a href="course.html" class="nav-item">培训课程</a><a href="mall.html" class="nav-item">商城</a><a href="community.html" class="nav-item">信息交流</a><a href="profile.html" class="nav-item">个人中心</a></div><div class="nav-actions"><div class="search-bar"><input type="text" placeholder="搜索政策、课程、农机、行情..."><button class="search-btn"><i class="fa-solid fa-search"></i></button></div><div class="user-actions"><a href="messages.html"><i class="fa-solid fa-bell" style="font-size:20px;color:var(--text-secondary);margin-right:20px;"></i></a><a href="profile.html" class="user-avatar" style="background-image:url('images/avatar.png');background-size:cover;color:transparent;"></a></div></div></nav><div class="main-content"><div class="service-page"><section class="service-hero"><span class="service-kicker"><i class="fa-solid fa-cloud-sun"></i> 智慧气象服务</span><h1 class="service-title">气象预警</h1><p class="service-desc">提供天气预报、灾害预警和地块订阅提醒，降低极端天气对作物生产的影响。</p><div class="service-actions"><a class="service-btn" href="#service-form"><i class="fa-solid fa-paper-plane"></i> 在线办理 / 咨询</a><a class="service-btn light" href="home.html"><i class="fa-solid fa-arrow-left"></i> 返回首页</a></div></section><section class="service-stats"><div class="stat-card"><div class="stat-label">当前风险</div><div class="stat-value">中等</div><div class="stat-tip">局部降雨与降温</div></div><div class="stat-card"><div class="stat-label">未来24小时</div><div class="stat-value">18℃</div><div class="stat-tip">东北风3级</div></div><div class="stat-card"><div class="stat-label">预警订阅</div><div class="stat-value">4类</div><div class="stat-tip">霜冻、暴雨、高温、病虫害</div></div><div class="stat-card"><div class="stat-label">地块提醒</div><div class="stat-value">6条</div><div class="stat-tip">按作物类型推送</div></div></section><section class="service-grid"><div class="module-card"><div class="module-title"><i class="fa-solid fa-cloud-bolt"></i> 七日农事天气</div><table class="data-table"><tr><th>日期</th><th>天气</th><th>温度</th><th>农事建议</th></tr><tr><td>今日</td><td>多云转小雨</td><td>12-18℃</td><td>注意排水，暂缓施药</td></tr><tr><td>明日</td><td>阴</td><td>10-16℃</td><td>加强苗情巡查</td></tr><tr><td>后日</td><td>晴</td><td>13-22℃</td><td>适合追肥与除草</td></tr></table></div><aside class="form-card" id="service-form"><div class="module-title"><i class="fa-solid fa-file-signature"></i> 预警订阅</div><input class="service-input" placeholder="乡镇/地块名称"><select class="service-select"><option>小麦</option><option>玉米</option><option>水稻</option><option>蔬菜大棚</option></select><label><input type="checkbox" checked> 霜冻预警</label><br><label><input type="checkbox" checked> 暴雨预警</label><br><br><button class="service-btn service-submit" data-msg="订阅成功：系统将按地块和作物类型推送气象预警。">提交</button><div class="result-box service-result">填写信息后，这里会展示处理结果。</div></aside></section></div></div><script src="js/app.js"></script></body></html>
