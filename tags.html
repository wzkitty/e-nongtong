<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>“e”农通 - 选择您的标签</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/tags.css">
  <link rel="stylesheet" href="css/enhance.css">
  <link rel="stylesheet" href="css/course-player-admin.css">
</head>
<body>

  <!-- 页面背景修饰 -->
  <div class="page-decoration"></div>

  <div class="tags-page-container">
    <div class="tags-main-content">
      
      <!-- 头部 -->
      <div class="tags-header">
        <h1 class="tags-title">定制您的专属服务</h1>
        <p class="tags-subtitle">选择您关注的领域，我们将为您精准推送前沿资讯与优质装备</p>
      </div>

      <!-- 农业领域 -->
      <div class="tags-category">
        <h3 class="category-title"><i class="fa-solid fa-seedling"></i> 您关注的农业领域</h3>
        <div class="tags-grid">
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t1.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">粮食作物</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t2.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">经济作物</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t3.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">畜牧养殖</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t4.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">水产养殖</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 农机类型 -->
      <div class="tags-category">
        <h3 class="category-title"><i class="fa-solid fa-tractor"></i> 您关注的农机类型</h3>
        <div class="tags-grid">
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t5.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">农用动力机</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t6.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">农用排灌机械</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t7.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">农作物收获机械</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t8.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">农用拖拉机</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t9.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">智能种植机械</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
          <div class="tag-item" onclick="toggleTag(this)">
            <div class="tag-bg" style="background-image: url('./images/t10.png')"></div>
            <div class="tag-overlay"></div>
            <div class="tag-content">
              <span class="tag-text">现代植保机械</span>
              <div class="tag-check-circle"><i class="fa-solid fa-check"></i></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部操作区 -->
      <div class="tags-footer">
        <a href="home.html" class="btn-start">
          开启智慧农耕 <i class="fa-solid fa-arrow-right"></i>
        </a>
        <a href="home.html" class="btn-skip">直接跳过</a>
      </div>

    </div>
  </div>

  <script>
    // 标签多选高亮切换逻辑
    function toggleTag(element) {
      element.classList.toggle('selected');
    }
  </script>
  <script src="js/app.js"></script>
</body>
</html>
