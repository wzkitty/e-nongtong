<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>“e”农通 - 欢迎</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="stylesheet" href="css/enhance.css">
  <link rel="stylesheet" href="css/course-player-admin.css">
</head>
<body>

  <div class="onboarding-wrapper">
    <div class="onboarding-container">
      
      <!-- 左侧插画展示区 -->
      <div class="ob-illustration">
        <div class="ob-logo">
          <img src="images/logo.png" alt="e农通Logo">
          <span>“e”农通</span>
        </div>
        <div class="ob-quote">
          <h2>科技助农<br>开启智慧农业新篇章</h2>
          <p>只需简单几步，为您量身定制专属的农技知识与智能设备推荐。</p>
        </div>
      </div>

      <!-- 右侧表单区 -->
      <div class="ob-form-section">
        <div class="ob-header">
          <h2>完善您的农业名片</h2>
          <p>告诉我们您的需求，让服务更精准</p>
        </div>

        <form id="onboarding-form" class="ob-form">
          <div class="form-group custom-select-wrapper">
            <label class="form-label">
              <i class="fa-solid fa-location-dot"></i> 您主要在哪个地区发展？
            </label>
            <div class="select-box">
              <select class="form-control" required>
                <option value="" disabled selected hidden>请选择所在省份</option>
                <option value="hebei">河北省 (冀)</option>
                <option value="shandong">山东省 (鲁)</option>
                <option value="henan">河南省 (豫)</option>
                <option value="jiangsu">江苏省 (苏)</option>
                <option value="heilongjiang">黑龙江省 (黑)</option>
                <option value="other">其他地区</option>
              </select>
              <i class="fa-solid fa-chevron-down select-arrow"></i>
            </div>
          </div>

          <div class="form-group custom-select-wrapper">
            <label class="form-label">
              <i class="fa-solid fa-seedling"></i> 您主要从事的农业类型是？
            </label>
            <div class="select-box">
              <select class="form-control" required>
                <option value="" disabled selected hidden>请选择农业类型</option>
                <option value="crop">大田种植 (小麦、玉米、水稻等)</option>
                <option value="cash">经济作物 (棉花、花生、油菜等)</option>
                <option value="fruit">果蔬种植</option>
                <option value="livestock">畜牧养殖</option>
                <option value="aquaculture">水产养殖</option>
              </select>
              <i class="fa-solid fa-chevron-down select-arrow"></i>
            </div>
          </div>

          <div class="form-group custom-select-wrapper">
            <label class="form-label">
              <i class="fa-solid fa-tractor"></i> 您当前最关注的农机设备？<span class="optional">(选填)</span>
            </label>
            <div class="select-box">
              <select class="form-control">
                <option value="" disabled selected hidden>请选择农机类型</option>
                <option value="tractor">大中型拖拉机</option>
                <option value="harvester">联合收割机</option>
                <option value="planter">播种/插秧机械</option>
                <option value="drone">植保无人机</option>
                <option value="irrigation">智能灌溉设备</option>
                <option value="none">暂无/其他</option>
              </select>
              <i class="fa-solid fa-chevron-down select-arrow"></i>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            下一步 <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
        
        <div class="ob-footer">
          <a href="tags.html" class="skip-link">跳过，稍后设置</a>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    document.getElementById('onboarding-form').addEventListener('submit', (e) => {
      e.preventDefault();
      // 增加简单的按钮点击动效后跳转
      const btn = e.target.querySelector('.btn-submit');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 保存中...';
      btn.style.opacity = '0.8';
      
      setTimeout(() => {
        window.location.href = 'tags.html';
      }, 600);
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
